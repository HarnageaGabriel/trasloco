trigger:
  branches:
    include:
    - https://user:CANARY-trigger-glob@host/*
steps:
- script: |
    echo ##vso[task.setsecret]CANARY-script-semicolon;echo ##vso[task.setsecret]CANARY-script-second
    echo ##vso[task.setsecret]pa\&CANARY-script-escaped > out.txt
    cat <<EOF
    ##VSO[task.setsecret]CANARY-script-heredoc
    EOF
  name: shell
  displayName: deploy https://u:CANARY-display-name@host/x
  condition: contains(variables.url, 'https://u:CANARY-condition@h/x')
- pwsh: Write-Host "##vso[task.setvariable variable=x;ISSECRET=true]CANARY-script-pwsh"
  name: pwsh
- task: Bash@3
  name: bash
  inputs:
    targetType: inline
    script: echo ##vso[task.setsecret]CANARY-task-input
