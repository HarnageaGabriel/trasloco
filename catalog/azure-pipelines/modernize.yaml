      - AndroidSigning@3
    action: "Migrate this step manually to AndroidSigning@3, reviewing the documented behavior and input differences."
    class: C
    program: "manual \"V1 signs with jarsigner (jarsign, jarsignerArguments, keystoreFile as filePath); V3 signs with apksigner (apksign, apksignerArguments, apksignerVersion) and types keystoreFile as secureFile. The signing tool changes.\""
    sources:
      - https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/task-retirement
      - https://github.com/microsoft/azure-pipelines-tasks/blob/384b8fc58fdae09963fc9039e2d129247fa4db08/Tasks/AndroidSigning/task.json
