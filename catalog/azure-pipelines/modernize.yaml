  - task: AndroidSigning@2
    guid: "80f3f6a0-82a6-4a22-ba7a-e5b8c541b9b9"
    replacement:
      - AndroidSigning@3
    action: "Migrate this step manually to AndroidSigning@3, reviewing the documented behavior and input differences."
    class: C
    program: "manual \"jarsign and jarsignerArguments (default -verbose -sigalg MD5withRSA -digestalg SHA1) are removed; apksign, apksignerArguments, apksignerVersion, apksignerLocation are added; the aliases of the keystore inputs change from jarsigner* to apksigner*. The tool that signs changes.\""
    sources:
