version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - depguard
    - forbidigo
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    depguard:
      rules:
        pure:
          list-mode: lax
          files:
            - "**/internal/ir/**/*.go"
            - "**/internal/diag/**/*.go"
            - "**/internal/dialect/**/*.go"
            - "**/internal/yamlx/**/*.go"
            - "**/internal/naming/**/*.go"
            - "!$test"
          deny:
            - pkg: "net/http$"
              desc: "Pure packages must not perform I/O (CONVENTIONS.md)."
            - pkg: "os$"
              desc: "Pure packages must not perform I/O (CONVENTIONS.md)."
            - pkg: "os/exec$"
              desc: "Pure packages must not perform I/O (CONVENTIONS.md)."
            - pkg: "database/sql$"
              desc: "Pure packages must not perform I/O (CONVENTIONS.md)."
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^time\.Now$'
          msg: "Inject internal/clock.Clock (ADR 0010)."
  exclusions:
    rules:
      - path: 'internal[\/]clock[\/]'
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - gosec
          - gocritic

formatters:
  enable:
    - gofumpt
