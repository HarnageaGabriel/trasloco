<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Planned lifecycle: audit, then plan with no changes, then apply; every step is recorded in a local ledger, so an interrupted apply resumes where it stopped; then verify, or roll back"><title>Plan, apply, resume, verify, roll back</title><rect width="0" height="0"><animate id="lclk" attributeName="x" from="0" to="0" dur="12.0s" begin="0s;lclk.end"/></rect><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><path d="M190,146.0 L250,146.0" stroke="#3D444D" stroke-width="2" fill="none"/><path d="M400,146.0 L460,146.0" stroke="#3D444D" stroke-width="2" fill="none"/><path d="M610,146.0 L770,146.0" stroke="#3D444D" stroke-width="2" fill="none"/><path d="M500,120 L500,70" stroke="#3D444D" stroke-width="2" fill="none"/><path d="M570,70 L570,120" stroke="#3D444D" stroke-width="2" fill="none"/><path d="M480,172 C460,222 450,246 450,262" stroke="#3D444D" stroke-width="2" fill="none"/><path d="M590,172 C610,212 650,262 650,262" stroke="#3D444D" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M241,141.0 L250,146.0 L241,151.0" stroke="#3D444D" stroke-width="2" fill="none"/><path d="M451,141.0 L460,146.0 L451,151.0" stroke="#3D444D" stroke-width="2" fill="none"/><path d="M761,141.0 L770,146.0 L761,151.0" stroke="#3D444D" stroke-width="2" fill="none"/><text x="458" y="96" text-anchor="end" font-size="11.5" fill="#9198A1">interrupted</text><text x="612" y="96" font-size="11.5" fill="#9198A1">continues</text><text x="480" y="240" font-size="11.5" fill="#9198A1">every step recorded</text><rect x="40" y="120" width="150" height="52" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.5"><animate attributeName="stroke" values="#F0A83A;#F0A83A;#3D444D" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+0.00s"/><animate attributeName="stroke-width" values="3;3;1.5" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+0.00s"/></rect><text x="115.0" y="142" text-anchor="middle" font-size="15" font-weight="600" fill="#E6EDF3">audit</text><text x="115.0" y="160" text-anchor="middle" font-size="11" fill="#8B949E">inventory</text><rect x="250" y="120" width="150" height="52" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.5"><animate attributeName="stroke" values="#F0A83A;#F0A83A;#3D444D" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+1.20s"/><animate attributeName="stroke-width" values="3;3;1.5" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+1.20s"/></rect><text x="325.0" y="142" text-anchor="middle" font-size="15" font-weight="600" fill="#E6EDF3">plan</text><text x="325.0" y="160" text-anchor="middle" font-size="11" fill="#8B949E">reviewable, no changes</text><rect x="460" y="120" width="150" height="52" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.5"><animate attributeName="stroke" values="#F0A83A;#F0A83A;#3D444D" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+2.40s"/><animate attributeName="stroke-width" values="3;3;1.5" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+2.40s"/><animate attributeName="stroke" values="#E5534B;#E5534B;#3D444D" keyTimes="0;0.6;1" dur="1.2s" begin="lclk.begin+3.60s"/><animate attributeName="stroke-width" values="3;3;1.5" keyTimes="0;0.6;1" dur="1.2s" begin="lclk.begin+3.60s"/><animate attributeName="stroke" values="#F0A83A;#F0A83A;#3D444D" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+6.00s"/><animate attributeName="stroke-width" values="3;3;1.5" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+6.00s"/></rect><text x="535.0" y="142" text-anchor="middle" font-size="15" font-weight="600" fill="#E6EDF3">apply</text><text x="535.0" y="160" text-anchor="middle" font-size="11" fill="#8B949E">changes the platforms</text><rect x="460" y="18" width="150" height="52" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.5"><animate attributeName="stroke" values="#F0A83A;#F0A83A;#3D444D" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+4.60s"/><animate attributeName="stroke-width" values="3;3;1.5" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+4.60s"/></rect><text x="535.0" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#E6EDF3">resume</text><text x="535.0" y="58" text-anchor="middle" font-size="11" fill="#8B949E">from the last good step</text><rect x="770" y="120" width="150" height="52" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.5"><animate attributeName="stroke" values="#3FB950;#3FB950;#3D444D" keyTimes="0;0.6;1" dur="2.0s" begin="lclk.begin+7.60s"/><animate attributeName="stroke-width" values="3;3;1.5" keyTimes="0;0.6;1" dur="2.0s" begin="lclk.begin+7.60s"/></rect><text x="845.0" y="142" text-anchor="middle" font-size="15" font-weight="600" fill="#E6EDF3">verify</text><text x="845.0" y="160" text-anchor="middle" font-size="11" fill="#8B949E">matches the plan</text><rect x="650" y="236" width="150" height="52" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.5" stroke-dasharray="5 4"><animate attributeName="stroke" values="#8B949E;#8B949E;#3D444D" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+10.00s"/><animate attributeName="stroke-width" values="3;3;1.5" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+10.00s"/></rect><text x="725.0" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#E6EDF3">rollback</text><text x="725.0" y="276" text-anchor="middle" font-size="11" fill="#8B949E">undo what apply created</text><g><path d="M300,244 L300,290 A75.0,9 0 0 0 450,290 L450,244" fill="#161B22" stroke="#3D444D" stroke-width="1.5"/><ellipse cx="375.0" cy="244" rx="75.0" ry="9" fill="#161B22" stroke="#3D444D" stroke-width="1.5"><animate attributeName="stroke" values="#F0A83A;#F0A83A;#3D444D" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+3.00s"/><animate attributeName="stroke-width" values="3;3;1.5" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+3.00s"/><animate attributeName="stroke" values="#F0A83A;#F0A83A;#3D444D" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+5.60s"/><animate attributeName="stroke-width" values="3;3;1.5" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+5.60s"/><animate attributeName="stroke" values="#F0A83A;#F0A83A;#3D444D" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+7.00s"/><animate attributeName="stroke-width" values="3;3;1.5" keyTimes="0;0.6;1" dur="1.4s" begin="lclk.begin+7.00s"/></ellipse><text x="375.0" y="274" text-anchor="middle" font-size="15" font-weight="600" fill="#E6EDF3">ledger</text><text x="375.0" y="290" text-anchor="middle" font-size="11" fill="#8B949E">local SQLite file</text></g><circle r="6" fill="#F0A83A" opacity="0"><set attributeName="opacity" to="1" begin="lclk.begin+0.40s"/><set attributeName="opacity" to="0" begin="lclk.begin+1.20s"/><animateMotion path="M190,146.0 L250,146.0" dur="0.8s" begin="lclk.begin+0.40s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/></circle><circle r="6" fill="#F0A83A" opacity="0"><set attributeName="opacity" to="1" begin="lclk.begin+1.60s"/><set attributeName="opacity" to="0" begin="lclk.begin+2.40s"/><animateMotion path="M400,146.0 L460,146.0" dur="0.8s" begin="lclk.begin+1.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/></circle><circle r="5" fill="#F0A83A" opacity="0"><set attributeName="opacity" to="1" begin="lclk.begin+2.60s"/><set attributeName="opacity" to="0" begin="lclk.begin+3.10s"/><animateMotion path="M480,172 C460,222 450,246 450,262" dur="0.5s" begin="lclk.begin+2.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/></circle><circle r="6" fill="#E5534B" opacity="0"><set attributeName="opacity" to="1" begin="lclk.begin+3.80s"/><set attributeName="opacity" to="0" begin="lclk.begin+4.50s"/><animateMotion path="M500,120 L500,70" dur="0.7s" begin="lclk.begin+3.80s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/></circle><circle r="6" fill="#F0A83A" opacity="0"><set attributeName="opacity" to="1" begin="lclk.begin+5.00s"/><set attributeName="opacity" to="0" begin="lclk.begin+5.80s"/><animateMotion path="M570,70 L570,120" dur="0.8s" begin="lclk.begin+5.00s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/></circle><circle r="5" fill="#F0A83A" opacity="0"><set attributeName="opacity" to="1" begin="lclk.begin+5.40s"/><set attributeName="opacity" to="0" begin="lclk.begin+5.80s"/><animateMotion path="M480,172 C460,222 450,246 450,262" dur="0.4s" begin="lclk.begin+5.40s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/></circle><circle r="5" fill="#F0A83A" opacity="0"><set attributeName="opacity" to="1" begin="lclk.begin+6.60s"/><set attributeName="opacity" to="0" begin="lclk.begin+7.00s"/><animateMotion path="M480,172 C460,222 450,246 450,262" dur="0.4s" begin="lclk.begin+6.60s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/></circle><circle r="6" fill="#F0A83A" opacity="0"><set attributeName="opacity" to="1" begin="lclk.begin+6.90s"/><set attributeName="opacity" to="0" begin="lclk.begin+7.70s"/><animateMotion path="M610,146.0 L770,146.0" dur="0.8s" begin="lclk.begin+6.90s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/></circle><circle r="5" fill="#8B949E" opacity="0"><set attributeName="opacity" to="1" begin="lclk.begin+9.40s"/><set attributeName="opacity" to="0" begin="lclk.begin+10.10s"/><animateMotion path="M590,172 C610,212 650,262 650,262" dur="0.7s" begin="lclk.begin+9.40s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/></circle><text x="40" y="318" font-size="12" fill="#9198A1">Planned lifecycle for changes to the platforms (milestones M3-M4); the ledger already exists.</text></g></svg>
