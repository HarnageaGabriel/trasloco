ll="freeze" calcMode="discrete" values="0;7;14;22;29;36;43;51;58;65;72;80;87;94;101;108;116;123;130;137;145;152;159;166;174;181;188;195;202;210;217;224;231;239;246;253;260;268;275;282;289;296;304;311;318;325;333;340;347;354;362;369;376;383;390;398;405;412;419;427;434;441;448;455;463;470;477;484;492;499;506;513;521;528"/></rect></clipPath></defs><title>Find retired Azure Pipelines tasks from the shell</title><rect width="960" height="286" rx="12" fill="#0D1117" stroke="#3D444D"/><rect width="960" height="36" rx="12" fill="#161B22"/><rect y="24" width="960" height="12" fill="#161B22"/><circle cx="22" cy="18" r="6" fill="#FF5F57"/><circle cx="42" cy="18" r="6" fill="#FEBC2E"/><circle cx="62" cy="18" r="6" fill="#28C840"/><text x="480.0" y="22" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#9198A1">retired tasks check · sample repository</text><rect width="0" height="0"><animate id="clk" attributeName="x" from="0" to="0" dur="16.0s" begin="0s;clk.end"/></rect><g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" xml:space="preserve"><text x="22" y="66" clip-path="url(#c0)"><tspan fill="#F0A83A">$ </tspan><tspan fill="#E6EDF3">url=https://raw.githubusercontent.com/HarnageaGabriel/trasloco/main/catalog/azure-pipelines/tasks.retirement.yaml</tspan></text><text x="22" y="88" clip-path="url(#c1)"><tspan fill="#F0A83A">$ </tspan><tspan fill="#E6EDF3">curl -fsSL "$url" | sed -n 's/^ *- task: //p' &gt; retired-tasks.txt</tspan></text><text x="22" y="110" clip-path="url(#c2)"><tspan fill="#F0A83A">$ </tspan><tspan fill="#E6EDF3">wc -l &lt; retired-tasks.txt</tspan></text><text x="22" y="132"><tspan fill="#E6EDF3">73</tspan><set attributeName="opacity" to="0" begin="clk.begin"/><set attributeName="opacity" to="1" begin="clk.begin+6.54s"/></text><text x="22" y="154" clip-path="url(#c4)"><tspan fill="#F0A83A">$ </tspan><tspan fill="#E6EDF3">grep -rniwF -f retired-tasks.txt --include='*.yml' --include='*.yaml' .</tspan></text><text x="22" y="176"><tspan fill="#D2A8FF">./azure-pipelines.yml</tspan><tspan fill="#9198A1">:</tspan><tspan fill="#7EE787">11</tspan><tspan fill="#9198A1">:</tspan><tspan fill="#E6EDF3">- task: </tspan><tspan fill="#FF7B72" font-weight="700">DotNetCoreCLI@1</tspan><set attributeName="opacity" to="0" begin="clk.begin"/><set attributeName="opacity" to="1" begin="clk.begin+8.91s"/></text><text x="22" y="198"><tspan fill="#D2A8FF">./templates/publish.yml</tspan><tspan fill="#9198A1">:</tspan><tspan fill="#7EE787">2</tspan><tspan fill="#9198A1">:</tspan><tspan fill="#E6EDF3">- task: </tspan><tspan fill="#FF7B72" font-weight="700">CopyFiles@1</tspan><set attributeName="opacity" to="0" begin="clk.begin"/><set attributeName="opacity" to="1" begin="clk.begin+9.16s"/></text><text x="22" y="220"><tspan fill="#D2A8FF">./templates/publish.yml</tspan><tspan fill="#9198A1">:</tspan><tspan fill="#7EE787">5</tspan><tspan fill="#9198A1">:</tspan><tspan fill="#E6EDF3">- task: </tspan><tspan fill="#FF7B72" font-weight="700">AzureCLI@0</tspan><set attributeName="opacity" to="0" begin="clk.begin"/><set attributeName="opacity" to="1" begin="clk.begin+9.41s"/></text><text x="22" y="242"><tspan fill="#F0A83A">$ </tspan><tspan fill="#E6EDF3">▍<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan><set attributeName="opacity" to="0" begin="clk.begin"/><set attributeName="opacity" to="1" begin="clk.begin+9.96s"/></text></g></svg>
