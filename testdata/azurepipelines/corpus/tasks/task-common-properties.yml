# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/steps-task
# features: [trigger-branches, pool-vmimage, root-steps, conditions, status-functions, task-copyfiles, task-publishbuildartifacts]
# expect: ok
trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: CopyFiles@2
    name: stageFiles
    displayName: Stage files
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    continueOnError: true
    enabled: true
    retryCountOnTaskFailure: 2
    timeoutInMinutes: 10
    env:
      DEBUG: 'true'
    inputs:
      SourceFolder: $(Build.SourcesDirectory)
      Contents: '**'
      TargetFolder: $(Build.ArtifactStagingDirectory)
  - task: PublishBuildArtifacts@1
    displayName: Publish
    condition: succeededOrFailed()
    timeoutInMinutes: 5
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)
      ArtifactName: drop
  - task: CopyFiles@2
    displayName: Disabled step
    enabled: false
    inputs:
      Contents: '**'
      TargetFolder: $(Build.ArtifactStagingDirectory)/unused
