# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/expressions
# features: [template-expression, directive-if, parameters-object, root-steps]
# expect: ok
parameters:
  - name: targets
    type: object
    default: [x86, x64, arm64]
  - name: mode
    type: string
    default: fast

pool:
  vmImage: ubuntu-latest

steps:
  - ${{ if containsValue(parameters.targets, 'arm64') }}:
      - script: echo has arm64
  - ${{ if containsValue(parameters.targets, 'x64') }}:
      - script: echo has x64
  - ${{ if in(parameters.mode, 'fast', 'slow') }}:
      - script: echo known mode
  - ${{ if notIn(parameters.mode, 'off', 'none') }}:
      - script: echo mode enabled
  - ${{ if gt(length(parameters.targets), 2) }}:
      - script: echo many targets
  - script: echo '${{ convertToJson(parameters.targets) }}'
