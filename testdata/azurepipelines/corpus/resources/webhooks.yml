# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/resources-webhooks-webhook
# features: [resources-webhooks, trigger-none]
# expect: ok
resources:
  webhooks:
  - webhook: incomingEvent
    connection: webhook-service-connection
    filters:
    - path: repositoryName
      value: contoso-app
    - path: action
      value: opened
trigger: none
pool:
  vmImage: ubuntu-latest
steps:
- script: echo action is ${{ parameters.incomingEvent.action }}
