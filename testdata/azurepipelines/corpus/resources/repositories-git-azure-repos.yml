resources:
  repositories:
  - repository: shared
    type: git
    name: Platform/shared-lib
    ref: refs/heads/main
trigger:
- main
pool:
  vmImage: ubuntu-latest
steps:
- checkout: self
- checkout: shared
- script: ls $(Build.SourcesDirectory)
