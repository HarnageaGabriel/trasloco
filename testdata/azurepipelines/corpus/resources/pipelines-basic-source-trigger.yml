# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/resources-pipelines-pipeline
# features: [resources-pipelines, trigger-branches, artifacts-download]
# expect: ok
resources:
  pipelines:
  - pipeline: upstream
    source: Contoso-CI
    project: Contoso
    trigger:
      branches:
        include:
        - main
        - releases/*
        exclude:
        - releases/old/*
trigger: none
pool:
  vmImage: ubuntu-latest
steps:
- download: upstream
  artifact: drop
- script: ls $(Pipeline.Workspace)/upstream/drop
