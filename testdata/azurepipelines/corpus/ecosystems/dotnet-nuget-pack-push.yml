# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/artifacts/nuget, https://learn.microsoft.com/en-us/azure/devops/pipelines/ecosystems/dotnet-core
# features: [root-stages, trigger-branches, pool-vmimage, ecosystem-dotnet, variables-map, conditions, parameters-string, parameters-boolean, task-nugetauthenticate, task-dotnetcorecli, task-nugetcommand, macro-syntax, template-expression, directive-if, artifacts-publish, artifacts-download, trigger-tags]
# expect: ok
trigger:
  tags:
    include:
      - v*
  branches:
    include:
      - main

parameters:
  - name: publishToNuGetOrg
    displayName: Also publish to nuget.org
    type: boolean
    default: false
  - name: feed
    type: string
    default: Contoso/internal

variables:
  buildConfiguration: Release
  packageVersion: 1.4.$(Build.BuildId)

pool:
  vmImage: windows-latest

stages:
  - stage: Pack
    jobs:
      - job: PackJob
        steps:
          - task: NuGetAuthenticate@1
          - task: DotNetCoreCLI@2
            displayName: Restore
            inputs:
              command: restore
              projects: src/**/*.csproj
              feedsToUse: config
              nugetConfigPath: nuget.config
          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              projects: tests/**/*.csproj
          - task: DotNetCoreCLI@2
            displayName: Pack
            inputs:
              command: pack
              packagesToPack: src/**/*.csproj
              configuration: $(buildConfiguration)
              versioningScheme: off
              buildProperties: Version=$(packageVersion)
              packDirectory: $(Build.ArtifactStagingDirectory)/packages
          - publish: $(Build.ArtifactStagingDirectory)/packages
            artifact: packages

  - stage: Push
    dependsOn: Pack
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - job: PushInternal
        steps:
          - download: current
            artifact: packages
          - task: NuGetAuthenticate@1
          - task: NuGetCommand@2
            displayName: Push to internal feed
            inputs:
              command: push
              packagesToPush: $(Pipeline.Workspace)/packages/*.nupkg
              nuGetFeedType: internal
              publishVstsFeed: ${{ parameters.feed }}
      - ${{ if eq(parameters.publishToNuGetOrg, true) }}:
          - job: PushPublic
            dependsOn: PushInternal
            steps:
              - download: current
                artifact: packages
              - task: NuGetCommand@2
                displayName: Push to nuget.org
                inputs:
                  command: push
                  packagesToPush: $(Pipeline.Workspace)/packages/*.nupkg
                  nuGetFeedType: external
                  publishFeedCredentials: nuget-org
