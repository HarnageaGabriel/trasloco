# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/ecosystems/python, https://learn.microsoft.com/en-us/azure/devops/pipelines/process/phases
# features: [root-jobs, trigger-branches, pool-vmimage, ecosystem-python, strategy-matrix, task-usepythonversion, task-publishtestresults, task-publishcodecoverageresults, caching, task-cache, variables-map, pr-trigger]
# expect: ok
trigger:
  - main

pr:
  - main

variables:
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip

jobs:
  - job: Test
    strategy:
      matrix:
        py310:
          python.version: '3.10'
        py311:
          python.version: '3.11'
        py312:
          python.version: '3.12'
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: UsePythonVersion@0
        displayName: Python $(python.version)
        inputs:
          versionSpec: $(python.version)
      - task: Cache@2
        inputs:
          key: 'pip | "$(Agent.OS)" | "$(python.version)" | requirements.txt'
          restoreKeys: |
            pip | "$(Agent.OS)" | "$(python.version)"
          path: $(PIP_CACHE_DIR)
      - script: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
        displayName: Create venv and install
      - script: |
          source .venv/bin/activate
          pytest --junitxml=junit/test-results.xml --cov=app --cov-report=xml --cov-report=html
        displayName: pytest
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: junit/test-*.xml
          testRunTitle: Python $(python.version)
      - task: PublishCodeCoverageResults@2
        inputs:
          summaryFileLocation: coverage.xml
