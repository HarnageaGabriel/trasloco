trigger: [main]
pool:
  vmImage: ubuntu-latest
steps:
  - bash: |
      echo "# Build report" > $(Agent.TempDirectory)/summary.md
      echo "all good" >> $(Agent.TempDirectory)/summary.md
      echo "##vso[task.uploadsummary]$(Agent.TempDirectory)/summary.md"
    displayName: Upload markdown summary
