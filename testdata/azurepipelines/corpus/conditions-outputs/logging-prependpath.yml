trigger: [main]
pool:
  vmImage: ubuntu-latest
steps:
  - bash: |
      mkdir -p $(Agent.ToolsDirectory)/mytool/bin
      echo "##vso[task.prependpath]$(Agent.ToolsDirectory)/mytool/bin"
    displayName: Add tool to PATH
  - script: echo $PATH
