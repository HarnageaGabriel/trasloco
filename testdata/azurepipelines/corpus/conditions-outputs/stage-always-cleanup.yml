# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/stages
# features: [conditions, status-functions, root-stages]
# expect: ok
trigger: [main]
stages:
  - stage: test
    jobs:
      - job: t
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: echo test
  - stage: report
    dependsOn: test
    condition: always()
    jobs:
      - job: r
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: echo report
  - stage: notify
    dependsOn: test
    condition: failed()
    jobs:
      - job: n
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: echo notify failure
