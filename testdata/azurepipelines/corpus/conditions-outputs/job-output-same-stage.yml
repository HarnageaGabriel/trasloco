# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/variables
# features: [dependencies-outputs, output-variables, logging-commands, runtime-expression, conditions]
# expect: ok
trigger: [main]
jobs:
  - job: A
    pool:
      vmImage: ubuntu-latest
    steps:
      - bash: echo "##vso[task.setvariable variable=shouldRun;isOutput=true]true"
        name: setout
  - job: B
    dependsOn: A
    condition: eq(dependencies.A.outputs['setout.shouldRun'], 'true')
    variables:
      fromA: $[ dependencies.A.outputs['setout.shouldRun'] ]
    pool:
      vmImage: ubuntu-latest
    steps:
      - script: echo $(fromA)
