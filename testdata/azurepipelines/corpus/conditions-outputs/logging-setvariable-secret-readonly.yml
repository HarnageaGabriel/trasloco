# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/scripts/logging-commands
# features: [logging-commands, output-variables, macro-syntax]
# expect: ok
trigger: [main]
pool:
  vmImage: ubuntu-latest
steps:
  - bash: |
      echo "##vso[task.setvariable variable=token;issecret=true]s3cr3t"
      echo "##vso[task.setvariable variable=build_flag;isReadOnly=true]on"
      echo "##vso[task.setvariable variable=shared;isOutput=true]yes"
    name: setvars
  - script: echo flag is $(build_flag)
