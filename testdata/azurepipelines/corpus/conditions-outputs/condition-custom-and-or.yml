# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/conditions
# features: [conditions, status-functions, runtime-expression]
# expect: ok
trigger: [main]
pool:
  vmImage: ubuntu-latest
steps:
  - script: echo main only
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  - script: echo not a PR
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  - script: echo release branch
    condition: or(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), eq(variables['forceRelease'], 'true'))
