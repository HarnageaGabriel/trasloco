# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/scheduled-triggers
# features: [schedules-cron, trigger-none]
# expect: ok
trigger: none
schedules:
- cron: '0 0 * * *'
  displayName: Daily midnight build
  branches:
    include:
    - main
pool:
  vmImage: ubuntu-latest
steps:
- script: echo nightly
