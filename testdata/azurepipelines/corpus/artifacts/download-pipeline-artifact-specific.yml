# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/download-pipeline-artifact-v2
# features: [artifacts-download, task-downloadpipelineartifact]
# expect: ok
trigger: none
pool:
  vmImage: ubuntu-latest
steps:
  - task: DownloadPipelineArtifact@2
    inputs:
      source: specific
      project: Contoso
      pipeline: 42
      runVersion: latestFromBranch
      runBranch: refs/heads/main
      artifact: webapp
      path: $(Pipeline.Workspace)/prev
