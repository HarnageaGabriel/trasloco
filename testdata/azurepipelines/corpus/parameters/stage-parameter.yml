# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/runtime-parameters
# features: [parameters-stage, root-stages]
# expect: ok
trigger: none
parameters:
- name: verifyStage
  type: stage
  default:
    stage: Verify
    jobs:
    - job: verify
      pool:
        vmImage: ubuntu-latest
      steps:
      - script: echo verify
stages:
- stage: Build
  jobs:
  - job: build
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: echo build
- ${{ parameters.verifyStage }}
