trigger: none
parameters:
- name: environment
  displayName: Target environment
  type: string
  default: dev
  values:
  - dev
  - staging
  - prod
pool:
  vmImage: ubuntu-latest
steps:
- script: echo Deploying to ${{ parameters.environment }}
