# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/deployment-jobs
# features: [deployment-canary, deployment-hooks, environment]
# expect: ok
trigger: [main]
pool:
  vmImage: ubuntu-latest
jobs:
  - deployment: canary
    environment:
      name: aks-prod
      resourceName: prod-ns
      resourceType: Kubernetes
    strategy:
      canary:
        increments: [10, 20]
        preDeploy:
          steps:
            - script: echo init
        deploy:
          steps:
            - script: echo deploy canary $(strategy.name) $(strategy.action)
        routeTraffic:
          steps:
            - script: echo shift traffic
        postRouteTraffic:
          pool: server
          steps:
            - task: Delay@1
              inputs:
                delayForMinutes: '2'
        on:
          failure:
            steps:
              - script: echo rollback
          success:
            steps:
              - script: echo promote
