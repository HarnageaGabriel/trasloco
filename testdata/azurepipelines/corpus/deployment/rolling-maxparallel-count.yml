trigger: [main]
pool:
  vmImage: ubuntu-latest
jobs:
  - deployment: vmdeploy
    environment:
      name: web-farm
      resourceType: VirtualMachine
      tags: web
    strategy:
      rolling:
        maxParallel: 2
        deploy:
          steps:
            - script: echo update
