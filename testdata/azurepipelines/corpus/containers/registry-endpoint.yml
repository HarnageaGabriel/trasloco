trigger: [main]
resources:
  containers:
    - container: private
      image: contoso.azurecr.io/build/agent:1.4
      endpoint: contoso-acr-connection
    - container: hub
      image: myorg/tools:latest
      endpoint: dockerhub-connection
      mapDockerSocket: false
pool:
  vmImage: ubuntu-latest
container: private
steps:
  - script: echo in private container
