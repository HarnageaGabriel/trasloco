# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/use-dotnet-v2
# features: [trigger-branches, pool-vmimage, root-steps, task-retired-version, task-dotnetcoreinstaller, ecosystem-dotnet]
# expect: ok
trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: DotNetCoreInstaller@1
    displayName: Install .NET Core SDK (legacy v1)
    inputs:
      packageType: sdk
      version: 3.1.x
