# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/copy-files-v2
# features: [trigger-branches, pool-vmimage, root-steps, task-retired-version, task-copyfiles]
# expect: ok
trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: CopyFiles@1
    displayName: Copy files (legacy)
    inputs:
      SourceFolder: $(Build.SourcesDirectory)
      Contents: '**/*.dll'
      TargetFolder: $(Build.ArtifactStagingDirectory)
