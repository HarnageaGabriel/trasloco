trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureCLI@0
    displayName: Azure CLI (legacy)
    inputs:
      azureSubscription: contoso-arm
      scriptLocation: inlineScript
      inlineScript: az account show
