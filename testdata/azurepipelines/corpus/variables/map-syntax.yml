trigger:
- main
variables:
  buildConfiguration: Release
  dotnetVersion: 8.x
  solution: '**/*.sln'
pool:
  vmImage: ubuntu-latest
steps:
- script: echo Building $(solution) as $(buildConfiguration) with $(dotnetVersion)
