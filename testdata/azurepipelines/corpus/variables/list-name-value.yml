# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/variables
# features: [variables-list, macro-syntax]
# expect: ok
trigger:
- main
variables:
- name: buildConfiguration
  value: Release
- name: platform
  value: x64
pool:
  vmImage: ubuntu-latest
steps:
- script: echo $(buildConfiguration) $(platform)
