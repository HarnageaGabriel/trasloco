# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/variables
# features: [variables-map, macro-syntax, task-powershell]
# expect: ok
trigger: none
variables:
  apiBase: https://api.contoso.example
pool:
  vmImage: ubuntu-latest
steps:
- script: ./call-api.sh
  displayName: Call API with secret mapped to env
  env:
    API_TOKEN: $(apiToken)
    API_BASE: $(apiBase)
- task: PowerShell@2
  inputs:
    targetType: inline
    script: Write-Host "token length $($env:API_TOKEN.Length)"
  env:
    API_TOKEN: $(apiToken)
