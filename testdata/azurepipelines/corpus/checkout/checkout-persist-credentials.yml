# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/yaml-schema/steps-checkout
# features: [checkout-fetchdepth]
# expect: ok
trigger: [main]
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
    persistCredentials: true
    fetchDepth: 10
  - script: |
      git config user.email ci@contoso.com
      git config user.name ci
      git tag build-$(Build.BuildId)
      git push origin build-$(Build.BuildId)
    displayName: Push tag
