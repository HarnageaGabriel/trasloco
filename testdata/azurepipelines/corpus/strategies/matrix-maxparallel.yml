# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/phases
# features: [strategy-matrix]
# expect: ok
trigger: [main]
pool:
  vmImage: ubuntu-latest
jobs:
  - job: test
    strategy:
      maxParallel: 2
      matrix:
        py39:
          python.version: '3.9'
        py310:
          python.version: '3.10'
        py311:
          python.version: '3.11'
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(python.version)
