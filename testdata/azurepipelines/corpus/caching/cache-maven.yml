# source: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/caching
# features: [caching, ecosystem-java, task-cache]
# expect: ok
trigger: [main]
variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
pool:
  vmImage: ubuntu-latest
steps:
  - task: Cache@2
    inputs:
      key: 'maven | "$(Agent.OS)" | **/pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
        maven
      path: $(MAVEN_CACHE_FOLDER)
    displayName: Cache Maven local repo
  - task: Maven@4
    inputs:
      mavenPomFile: pom.xml
      goals: package
