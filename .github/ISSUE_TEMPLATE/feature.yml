name: Feature request
description: Propose a focused capability or improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need is not currently met?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe behavior, scope, and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Safety and compatibility
      description: Note credential, destructive-operation, or compatibility implications.
