name: CI

on:
  push:
    branches: [main]
    # Tests read docs/spec and testdata Markdown: ignore only files no check reads.
    paths-ignore: ['README.md', 'CONTRIBUTING.md', 'SECURITY.md', 'CODE_OF_CONDUCT.md', 'docs/adr/**', 'docs/assets/**']
  pull_request:
    branches: [main]
    # No paths-ignore on PRs: the required status checks must report on every
    # PR, including docs-only ones, or branch protection blocks the merge.
  schedule:
    - cron: "17 2 * * 1" # weekly, includes macOS
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '["ubuntu-latest","windows-latest","macos-latest"]' || github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Test with race detector
        if: runner.os == 'macOS'
        run: go test -race -timeout 15m ./...
      - name: Test with race detector and coverage
        if: runner.os == 'Linux'
        run: go test -race -timeout 15m -covermode=atomic -coverprofile=coverage.out ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Coverage floors (CONVENTIONS.md)
        if: runner.os == 'Linux'
        run: python3 scripts/cover-floors.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Check deterministic ordering
        run: go run ./tools/orderlint ./...
      - name: Action script test
        run: bash action/run_test.sh
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Cross-compile all targets
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath ./cmd/trasloco || { echo "Cross-compile failed for ${target}"; exit 1; }
          done
      # govulncheck must use the latest patched toolchain: run it before switching to the minimum Go.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Generated docs drift
        run: make docs-check
      - name: Use minimum Go (go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build with minimum Go (go.mod)
        run: go build ./... && go vet ./...
