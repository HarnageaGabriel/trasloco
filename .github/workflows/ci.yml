name: CI

on:
  push:
    branches: [main]
    # Tests read docs/spec and testdata Markdown: ignore only files no check reads.
    paths-ignore: ['README.md', 'CONTRIBUTING.md', 'SECURITY.md', 'CODE_OF_CONDUCT.md', 'docs/adr/**', 'docs/assets/**']
  pull_request:
    branches: [main]
    # Tests read docs/spec and testdata Markdown: ignore only files no check reads.
    paths-ignore: ['README.md', 'CONTRIBUTING.md', 'SECURITY.md', 'CODE_OF_CONDUCT.md', 'docs/adr/**', 'docs/assets/**']
  schedule:
    - cron: "17 2 * * 1" # weekly, includes macOS
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '["ubuntu-latest","windows-latest","macos-latest"]' || github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Test with race detector
        if: runner.os == 'macOS'
        run: go test -race ./...
      - name: Test with race detector and coverage
        if: runner.os == 'Linux'
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Coverage floors (CONVENTIONS.md)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import pathlib
          import sys

          totals = collections.defaultdict(lambda: [0, 0])
          for line in pathlib.Path("coverage.out").read_text().splitlines()[1:]:
              location, statements, count = line.rsplit(" ", 2)
              package = location.rsplit("/", 1)[0]
              totals[package][0] += int(statements)
              totals[package][1] += int(statements) if int(count) else 0
          failures = []
          critical = {"httpx", "ledger", "redact", "credpool", "ratelimit"}
          exempt = set()
          for package, (total, covered) in sorted(totals.items()):
              floor = 80 if package.rsplit("/", 1)[-1] in critical else 70
              percent = 100 * covered / total if total else 100
              print(f"{package}: {percent:.1f}% (floor {floor}%)")
              if package.rsplit("/", 1)[-1] in exempt:
                  continue
              if total and 100 * covered < floor * total:
                  failures.append(package)
          if not totals:
              sys.exit("Empty coverage profile")
          if failures:
              sys.exit("Coverage below floor: " + ", ".join(failures))
          PY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Check deterministic ordering
        run: go run ./tools/orderlint ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Cross-compile all targets
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath ./cmd/trasloco || { echo "Cross-compile failed for ${target}"; exit 1; }
          done
      - name: Use minimum Go (go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build with minimum Go (go.mod)
        run: go build ./... && go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Generated docs drift
        run: make docs-check
