name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *" # nightly, includes macOS
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost 10x on private repositories: run it only on main and nightly, not on PRs.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # latest patched toolchain; govulncheck checks the stdlib too
          cache: true
      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...


      - name: Coverage floors (CONVENTIONS.md)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -coverprofile=coverage.out ./...
          python3 - <<'PY'
          import collections
          import pathlib
          import sys

          totals = collections.defaultdict(lambda: [0, 0])
          for line in pathlib.Path("coverage.out").read_text().splitlines()[1:]:
              location, statements, count = line.rsplit(" ", 2)
              package = location.rsplit("/", 1)[0]
              totals[package][0] += int(statements)
              totals[package][1] += int(statements) if int(count) else 0
          failures = []
          critical = {"httpx", "ledger", "redact", "credpool", "ratelimit"}
          for package, (total, covered) in sorted(totals.items()):
              floor = 80 if package.rsplit("/", 1)[-1] in critical else 70
              percent = 100 * covered / total if total else 100
              print(f"{package}: {percent:.1f}% (floor {floor}%)")
              if total and 100 * covered < floor * total:
                  failures.append(package)
          if not totals:
              sys.exit("Empty coverage profile")
          if failures:
              sys.exit("Coverage below floor: " + ", ".join(failures))
          PY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # latest patched toolchain; govulncheck checks the stdlib too
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # latest patched toolchain; govulncheck checks the stdlib too
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # latest patched toolchain; govulncheck checks the stdlib too
          cache: true
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./cmd/trasloco

  min-go:
    name: Build with minimum Go (go.mod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./... && go vet ./...
