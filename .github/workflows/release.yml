name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

# One release at a time, so the vMAJOR alias decision cannot race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (cosign v3.0.6)
      - name: Build, sign, and publish release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Move major release tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          major_tag="v${BASH_REMATCH[1]}"
          git fetch --force --tags --quiet origin
          highest=$(git tag --list "v${BASH_REMATCH[1]}.*" \
            | grep -E "^v${BASH_REMATCH[1]}\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$" | sort -V | tail -n 1)
          if [[ "${highest}" != "${GITHUB_REF_NAME}" ]]; then
            echo "${GITHUB_REF_NAME} is not the highest ${major_tag}.x.y release; leaving ${major_tag} unchanged"
            exit 0
          fi
          auth_header=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)
          echo "::add-mask::${auth_header}"
          git tag -f "${major_tag}" "${GITHUB_SHA}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            push -f origin "refs/tags/${major_tag}"
